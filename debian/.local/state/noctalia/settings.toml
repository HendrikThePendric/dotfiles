[bar.default]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_edge = 0
margin_ends = 0
radius = 0
shadow = false
thickness = 23

[dock]
icon_size = 48
position = "bottom"

[lockscreen]
blur_intensity = 0.59999999999999998
blurred_desktop = true
tint_intensity = 0.20000000000000001

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[plugins]
enabled = [ "noctalia/timer", "noctalia/wallhaven" ]

[shell]
app_icon_colorize = true
font_family = "JetBrainsMono Nerd Font"
settings_show_advanced = true

    [shell.screen_corners]
    size = 73

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/hendrik/pictures/wallpapers"

    [wallpaper.default]
    path = "/home/hendrik/pictures/wallpapers/space-piano.png"

    [wallpaper.last]
    path = "/home/hendrik/pictures/wallpapers/space-piano.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/hendrik/pictures/wallpapers/space-piano.png"